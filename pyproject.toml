[project]
name = "kobo-calibre-sync"
version = "0.1.0"
description = "Web app to import ebooks into Calibre and sync to Kobo via wireless"
requires-python = ">=3.9"
dependencies = [
    "flask>=3.0.0",
    "ebooklib>=0.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
kobo-calibre-sync = "src.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
